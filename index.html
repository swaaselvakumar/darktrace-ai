<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkTrace AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>🔐</span>
            <h1>DarkTrace AI</h1>
            <p>Dark Web Threat Intelligence Platform</p>
        </div>

        <div class="login-box">

            <h2>Investigator Login</h2>
            <p class="subtitle">Secure access to threat intelligence</p>

            <form id="loginForm">

                <label>Username</label>
                <input 
                    type="text" 
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login →</button>

                <p id="errorMessage"></p>

            </form>

        </div>

        <p class="footer">
            AI • Blockchain • Cybersecurity
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
